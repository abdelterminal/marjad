##
## MARJAD Nginx server template.
## Certbot may add TLS directives to this installed file. Runtime rules live in
## /etc/nginx/snippets/marjad-app.conf and can be updated without replacing TLS.
##

server {
    listen 80;
    server_name marjad.ma www.marjad.ma;

    include /etc/nginx/snippets/marjad-app.conf;
}
