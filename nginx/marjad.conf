##
## MARJAD — Nginx server block
## Replace marjad.ma with your actual domain before deploying.
## After running certbot, Nginx will append the SSL/443 block automatically.
##

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

server {
    listen 80;
    server_name marjad.ma www.marjad.ma;

    # Max upload size (product images via /api/admin/uploads)
    client_max_body_size 10m;

    # ------------------------------------------------------------------
    # /uploads/ — served directly from disk, NOT proxied through Node.js
    # This matches the BACKEND-2 upload path: /uploads/<uuid>.webp
    # ------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/marjad/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # Restrict to image types only — belt-and-suspenders
        location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # Block non-image files in uploads
        location ~* \.(php|sh|py|rb|pl)$ {
            deny all;
        }
    }

    # ------------------------------------------------------------------
    # /_next/static/ — immutable Next.js build assets
    # ------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # All other requests → Node.js / PM2 on port 3000
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_buffering off;

        # WebSocket support (Next.js HMR not needed in prod, but harmless)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client IP and proto to Next.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Timeouts — generous for slow DB queries on small VPS
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
